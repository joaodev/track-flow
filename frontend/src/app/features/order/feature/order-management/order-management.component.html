<div class="order-management-page">
  <header>
    <h1>{{ 'order.management.title' | translate }}</h1>
    <button mat-raised-button color="primary" (click)="onOpenCreateForm()">{{ 'order.management.newOrder' | translate }}</button>
  </header>

  @if (error$ | async; as error) {
    <p>{{ ('errors.' + error) | translate }}</p>
  }

  @if (customersById$ | async; as customersById) {
    <app-order-table
      [orders]="(orders$ | async) ?? []"
      [customersById]="customersById"
      (viewDetails)="onViewDetails($event)"
      (confirmOrder)="onConfirmOrder($event)"
      (shipOrder)="onShipOrder($event)"
      (cancelOrder)="onCancelOrder($event)"
    />
  }
</div>
