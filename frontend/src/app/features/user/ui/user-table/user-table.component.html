<table mat-table [dataSource]="users" class="mat-elevation-z1">
  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>Email</th>
    <td mat-cell *matCellDef="let user">{{ user.email }}</td>
  </ng-container>

  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef>Role</th>
    <td mat-cell *matCellDef="let user">
      <mat-select
        [value]="user.role"
        (selectionChange)="changeRole.emit({ id: user.id, role: $event.value })"
      >
        @for (role of roleOptions; track role) {
          <mat-option [value]="role">{{ role }}</mat-option>
        }
      </mat-select>
    </td>
  </ng-container>

  <ng-container matColumnDef="active">
    <th mat-header-cell *matHeaderCellDef>Status</th>
    <td mat-cell *matCellDef="let user">{{ user.active ? 'Active' : 'Deactivated' }}</td>
  </ng-container>

  <ng-container matColumnDef="createdAt">
    <th mat-header-cell *matHeaderCellDef>Created At</th>
    <td mat-cell *matCellDef="let user">{{ user.createdAt | date: 'short' }}</td>
  </ng-container>

  <ng-container matColumnDef="actions">
    <th mat-header-cell *matHeaderCellDef></th>
    <td mat-cell *matCellDef="let user">
      <button
        mat-button
        [color]="user.active ? 'warn' : 'primary'"
        (click)="toggleActive.emit({ id: user.id, active: !user.active })"
      >
        {{ user.active ? 'Deactivate' : 'Activate' }}
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
</table>

@if (users.length === 0) {
  <p>No users yet.</p>
}
