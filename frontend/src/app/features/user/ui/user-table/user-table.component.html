<div class="table-toolbar">
  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Search</mat-label>
    <input matInput (input)="applyFilter($any($event.target).value)" placeholder="Email..." />
  </mat-form-field>
</div>

<div class="table-scroll">
  <table mat-table [dataSource]="dataSource" matSort class="mat-elevation-z1">
    <ng-container matColumnDef="email">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
      <td mat-cell *matCellDef="let user">{{ user.email }}</td>
    </ng-container>

    <ng-container matColumnDef="role">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
      <td mat-cell *matCellDef="let user">
        <mat-select
          [value]="user.role"
          (selectionChange)="changeRole.emit({ id: user.id, role: $event.value })"
        >
          @for (role of roleOptions; track role) {
            <mat-option [value]="role">{{ role }}</mat-option>
          }
        </mat-select>
      </td>
    </ng-container>

    <ng-container matColumnDef="active">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let user">
        <span class="status-pill" [class]="user.active ? 'status-pill--delivered' : 'status-pill--cancelled'">
          {{ user.active ? 'Active' : 'Deactivated' }}
        </span>
      </td>
    </ng-container>

    <ng-container matColumnDef="createdAt">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Created At</th>
      <td mat-cell *matCellDef="let user">{{ user.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef class="col-center"></th>
      <td mat-cell *matCellDef="let user" class="col-center">
        <div class="actions-row">
          <button
            mat-stroked-button
            [color]="user.active ? 'warn' : 'primary'"
            (click)="toggleActive.emit({ id: user.id, active: !user.active })"
          >
            {{ user.active ? 'Deactivate' : 'Activate' }}
          </button>
          <button mat-icon-button color="warn" (click)="deleteUser.emit(user.id)" matTooltip="Delete user">
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell no-data" [attr.colspan]="displayedColumns.length">No users match your search.</td>
    </tr>
  </table>
</div>

<mat-paginator [pageSizeOptions]="[5, 10, 25]" [pageSize]="10" showFirstLastButtons=""></mat-paginator>
