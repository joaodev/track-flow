<div class="carrier-management-page">
  <header>
    <h1>{{ 'carrier.management.title' | translate }}</h1>
    <button mat-raised-button color="primary" (click)="onOpenCreateForm()">{{ 'carrier.management.newCarrier' | translate }}</button>
  </header>

  @if (error$ | async; as error) {
    <p>{{ ('errors.' + error) | translate }}</p>
  }

  <app-carrier-table
    [carriers]="(carriers$ | async) ?? []"
    [isAdmin]="(isAdmin$ | async) ?? false"
    (editCarrier)="onEditCarrier($event)"
    (toggleActive)="onToggleActive($event)"
    (deleteCarrier)="onDeleteCarrier($event)"
  />
</div>
