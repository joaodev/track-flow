<div class="shipment-list-page">
  <header>
    <h1>Shipments</h1>
    <button mat-raised-button color="primary" (click)="onOpenCreateForm()">New Shipment</button>
  </header>

  @if (stats$ | async; as stats) {
    <div class="stats-row">
      <app-stat-card label="Total Shipments" [value]="stats.total" icon="inventory_2" color="blue" />
      <app-stat-card label="In Transit" [value]="stats.inTransit" icon="local_shipping" color="amber" />
      <app-stat-card label="Delivered" [value]="stats.delivered" icon="check_circle" color="teal" />
      <app-stat-card label="Cancelled" [value]="stats.cancelled" icon="cancel" color="gray" />
    </div>
  }

  @if (error$ | async; as error) {
    <p>{{ error }}</p>
  }

  <app-shipment-table
    [shipments]="(shipments$ | async) ?? []"
    [loading]="(loading$ | async) ?? false"
    [isAdmin]="(isAdmin$ | async) ?? false"
    (updateStatus)="onUpdateStatus($event)"
    (viewDetails)="onViewDetails($event)"
    (deleteShipment)="onDeleteShipment($event)"
  />
</div>
