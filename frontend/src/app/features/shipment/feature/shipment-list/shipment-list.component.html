<div class="shipment-list-page">
  <header>
    <h1>{{ 'shipment.list.title' | translate }}</h1>
  </header>

  @if (stats$ | async; as stats) {
    <div class="stats-row">
      <app-stat-card [label]="'shipment.list.statTotal' | translate" [value]="stats.total" icon="inventory_2" color="blue" />
      <app-stat-card [label]="'shipment.list.statInTransit' | translate" [value]="stats.inTransit" icon="local_shipping" color="amber" />
      <app-stat-card [label]="'shipment.list.statDelivered' | translate" [value]="stats.delivered" icon="check_circle" color="teal" />
      <app-stat-card [label]="'shipment.list.statCancelled' | translate" [value]="stats.cancelled" icon="cancel" color="gray" />
    </div>
  }

  @if (error$ | async; as error) {
    <p>{{ error }}</p>
  }

  <app-shipment-table
    [shipments]="(shipments$ | async) ?? []"
    [loading]="(loading$ | async) ?? false"
    [isAdmin]="(isAdmin$ | async) ?? false"
    (updateStatus)="onUpdateStatus($event)"
    (viewDetails)="onViewDetails($event)"
    (deleteShipment)="onDeleteShipment($event)"
  />
</div>
