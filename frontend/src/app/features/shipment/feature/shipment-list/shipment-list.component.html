<div class="shipment-list-page">
  <header>
    <h1>Shipments</h1>
    <button mat-raised-button color="primary" (click)="toggleCreateForm()">
      {{ showCreateForm() ? 'Cancel' : 'New Shipment' }}
    </button>
    @if (isAdmin$ | async) {
      <a routerLink="/admin/users">Manage Users</a>
    }
  </header>

  @if (showCreateForm()) {
    <app-create-shipment-form (create)="onCreate($event)" />
  }

  @if (error$ | async; as error) {
    <p>{{ error }}</p>
  }

  <app-shipment-table
    [shipments]="(shipments$ | async) ?? []"
    [loading]="(loading$ | async) ?? false"
    (updateStatus)="onUpdateStatus($event)"
  />
</div>
