<div class="track-shipment-page">
  <h1>Track Shipment</h1>
  <p class="page-subtitle">Look up any shipment by its tracking code.</p>

  <app-track-search-form (search)="onSearch($event)" />

  @if (error$ | async; as error) {
    <div class="track-error">{{ error }}</div>
  }

  @if (shipment$ | async; as shipment) {
    <div class="track-result">
      <div class="track-result-header">
        <div>
          <span class="track-code">{{ shipment.trackingCode }}</span>
          <p class="track-route">{{ shipment.origin }} → {{ shipment.destination }}</p>
        </div>
        <span class="track-carrier">{{ shipment.carrier }}</span>
      </div>

      <app-tracking-progress [status]="shipment.status" />

      <h3>History</h3>
      <app-tracking-timeline [events]="(history$ | async) ?? []" />
    </div>
  }
</div>
