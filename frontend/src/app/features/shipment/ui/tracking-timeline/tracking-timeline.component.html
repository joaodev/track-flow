<ul class="timeline">
  @for (event of events; track event.id) {
    <li class="timeline-item">
      <div class="timeline-marker" [class]="'timeline-marker--' + event.status.toLowerCase()"></div>
      <div class="timeline-content">
        <div class="timeline-top">
          <span class="status-pill" [class]="'status-pill--' + event.status.toLowerCase()">
            {{ event.status }}
          </span>
          <span class="timeline-time">{{ event.occurredAt | date: 'dd/MM/yyyy HH:mm' }}</span>
        </div>
        @if (event.location) {
          <p class="timeline-location">
            <mat-icon inline="">place</mat-icon> {{ event.location }}
          </p>
        }
        @if (event.description) {
          <p class="timeline-description">{{ event.description }}</p>
        }
      </div>
    </li>
  } @empty {
    <li>No tracking history yet.</li>
  }
</ul>
