<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="outline">
    <mat-label>Tracking Code</mat-label>
    <input matInput formControlName="trackingCode" placeholder="e.g. TF1A2B3C4D5E" />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit">Track</button>
</form>
