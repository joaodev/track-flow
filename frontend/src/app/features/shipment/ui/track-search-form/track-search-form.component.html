<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <mat-form-field appearance="outline">
    <mat-label>{{ 'shipment.track.searchLabel' | translate }}</mat-label>
    <input matInput formControlName="trackingCode" [placeholder]="'shipment.track.searchPlaceholder' | translate" />
  </mat-form-field>

  <button mat-raised-button color="primary" type="submit">{{ 'shipment.track.submit' | translate }}</button>
</form>
