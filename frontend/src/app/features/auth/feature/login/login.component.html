<div class="login-page">
  <div class="login-brand">
    <div class="login-brand-content">
      <div class="brand-logo">
        <mat-icon>local_shipping</mat-icon>
        <span>{{ 'appShell.brand' | translate }}</span>
      </div>
      <h1>{{ 'auth.login.heroTitle' | translate }}</h1>
      <p>{{ 'auth.login.heroDescription' | translate }}</p>
    </div>
  </div>

  <div class="login-panel">
    <div class="login-card">
      <h2>{{ 'auth.login.cardTitle' | translate }}</h2>
      <p class="login-subtitle">{{ 'auth.login.subtitle' | translate }}</p>

      @if (error$ | async; as error) {
        <div class="login-error">{{ ('errors.' + error) | translate }}</div>
      }

      <app-login-form (login)="onLogin($event)" />
    </div>
  </div>
</div>
