services:

  postgres:
    image: postgres:17-alpine
    container_name: track-flow-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-track_flow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-track_flow_pw}
      POSTGRES_DB: ${DB_NAME:-track_flow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-track_flow}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data: